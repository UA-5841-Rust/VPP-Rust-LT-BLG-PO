# VPP startup configuration for the local test bench.

unix {
  interactive
  log /tmp/vpp-bench.log
  cli-listen /run/vpp/cli.sock
  # VPP executes CLI commands from this file on startup.
  # We use a relative path, so VPP must be started from the repo root.
  exec /path/to/vpp-bench.cli
}

# previous configuration
# cpu {
  # workers 1
# }

cpu {
  main-core 1
  corelist-workers 2-3
}
